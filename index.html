<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV ITALIA</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05080d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05080d;z-index:2}
.logo{font-size:88px;margin-bottom:18px}h1{font-size:42px;letter-spacing:3px;margin:0 0 10px}.msg{font-size:20px;color:#aeb9c7}
#player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="loading"><div class="logo">📺</div><h1>TV ITALIA</h1><div class="msg">Apertura del player…</div></div>
<iframe id="player" title="TV ITALIA Player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
(function(){
  var url='http://vionic.altervista.org/TVitaliaos/Screen/WebtvOsplay.html';
  var frame=document.getElementById('player');
  frame.onload=function(){document.getElementById('loading').style.display='none';};
  frame.src=url;
  document.addEventListener('keydown',function(e){
    if(e.key==='Backspace'||e.key==='Escape'){
      try{history.back();}catch(_){ }
    }
  });
})();
</script>
</body>
</html>
