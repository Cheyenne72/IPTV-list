<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web TV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#080b10;--panel:#11161e;--panel2:#19212c;--text:#f4f7fb;--muted:#9aa7b7;--border:#27303c;--accent:#e50914}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:360px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.header{padding:18px 16px 12px;font-size:21px;font-weight:700}.controls{padding:0 12px 12px}.search{width:100%;background:#0b0f15;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:15px;outline:none}.search:focus{border-color:#64748b}.categories{display:flex;gap:7px;overflow:auto;padding:0 12px 12px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.cat{border:1px solid var(--border);background:#0b0f15;color:#cbd5e1;border-radius:999px;padding:7px 11px;white-space:nowrap;cursor:pointer}.cat.active{background:var(--accent);border-color:var(--accent);color:#fff}.count{padding:0 16px 8px;color:var(--muted);font-size:12px}.list{overflow:auto;padding:0 8px 12px}.channel{display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;background:transparent;color:var(--text);padding:9px;border-radius:9px;text-align:left;cursor:pointer;margin-bottom:3px}.channel:hover,.channel:focus{background:var(--panel2);outline:none}.channel.selected{background:#242d39;border-color:#364354}.logo{width:45px;height:45px;border-radius:7px;object-fit:contain;background:#fff;flex:none}.no-logo{display:flex;align-items:center;justify-content:center;background:#252d38;color:#94a3b8;font-size:12px}.info{min-width:0}.name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:11px;color:var(--muted);margin-top:4px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{height:58px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);gap:12px}.title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{margin-left:auto;color:var(--muted);font-size:12px}.player-wrap{position:relative;flex:1;background:#000;display:flex;align-items:center;justify-content:center;min-height:0}video{width:100%;height:100%;object-fit:contain;background:#000}.placeholder{position:absolute;text-align:center;color:#9aa7b7;pointer-events:none}.placeholder b{display:block;color:#fff;font-size:20px;margin-bottom:8px}.bottom{min-height:64px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}.btn{background:#202936;color:#fff;border:1px solid #344153;border-radius:8px;padding:10px 14px;cursor:pointer}.btn:hover,.btn:focus{background:#2b3645;outline:none}.error{color:#ff8a8a;font-size:12px;margin-left:auto;max-width:50%;text-align:right}@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:48vh 52vh}.sidebar{order:2;border-right:0;border-top:1px solid var(--border)}.main{order:1}.topbar{height:48px}.bottom{min-height:54px}} 
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="header">📺 Web TV Player</div>
<div class="controls"><input id="search" class="search" type="search" placeholder="Cerca canale..." autocomplete="off"></div>
<div id="categories" class="categories"></div><div id="count" class="count">Caricamento playlist…</div><div id="list" class="list"></div>
</aside>
<main class="main">
<div class="topbar"><div id="title" class="title">Seleziona un canale</div><div id="status" class="status">Caricamento…</div></div>
<div class="player-wrap"><video id="video" controls playsinline preload="metadata"></video><div id="placeholder" class="placeholder"><b>Web TV Player</b>Seleziona un canale dalla lista</div></div>
<div class="bottom"><button id="reload" class="btn">↻ Aggiorna lista</button><button id="fullscreen" class="btn">⛶ Schermo intero</button><div id="error" class="error"></div></div>
</main></div>
<script>
const PLAYLIST_URL='https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8';
const video=document.getElementById('video'),listEl=document.getElementById('list'),catsEl=document.getElementById('categories'),searchEl=document.getElementById('search'),countEl=document.getElementById('count'),titleEl=document.getElementById('title'),statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),placeholder=document.getElementById('placeholder');
let channels=[],category='Tutti',hls=null,selected=null;
function attr(line,key){const m=line.match(new RegExp(key+'="([^"]*)"','i'));return m?m[1]:''}
function parseM3U(text){const lines=text.replace(/\r/g,'').split('\n'),out=[];for(let i=0;i<lines.length;i++){if(!lines[i].startsWith('#EXTINF'))continue;const info=lines[i],url=(lines[i+1]||'').trim();if(!url||url.startsWith('#'))continue;const comma=info.indexOf(','),name=comma>=0?info.slice(comma+1).trim():'Canale';out.push({name,group:attr(info,'group-title')||'Senza categoria',logo:attr(info,'tvg-logo'),id:attr(info,'tvg-id'),chno:attr(info,'tvg-chno'),country:attr(info,'country'),url})}return out}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function categories(){const set=['Tutti',...new Set(channels.map(c=>c.group).filter(Boolean))];catsEl.innerHTML=set.map(c=>`<button class="cat ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');catsEl.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{category=b.dataset.cat;categories();render()})}
function filtered(){const q=searchEl.value.trim().toLowerCase();return channels.filter(c=>(category==='Tutti'||c.group===category)&&(!q||c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q)||c.country.toLowerCase().includes(q)))}
function render(){const arr=filtered();countEl.textContent=`${arr.length} canali${category!=='Tutti'?' · '+category:''}`;listEl.innerHTML='';arr.forEach(c=>{const b=document.createElement('button');b.className='channel'+(selected===c?' selected':'');b.tabIndex=0;b.innerHTML=`${c.logo?`<img class="logo" src="${esc(c.logo)}" alt="" loading="lazy">`:'<span class="logo no-logo">TV</span>'}<span class="info"><span class="name">${c.chno?esc(c.chno)+' · ':''}${esc(c.name)}</span><span class="group">${esc(c.group)}${c.country?' · '+esc(c.country):''}</span></span>`;b.onclick=()=>play(c);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play(c)}};listEl.appendChild(b)})}
async function loadPlaylist(){statusEl.textContent='Caricamento…';errorEl.textContent='';try{const r=await fetch(PLAYLIST_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);channels=parseM3U(await r.text());if(!channels.length)throw new Error('Playlist vuota o formato non riconosciuto');category='Tutti';categories();render();statusEl.textContent=`${channels.length} canali`}catch(e){statusEl.textContent='Errore';errorEl.textContent='Impossibile caricare la playlist: '+e.message;countEl.textContent='Nessun canale disponibile'}}
function destroyHls(){if(hls){hls.destroy();hls=null}}
function play(c){selected=c;render();titleEl.textContent=c.name;statusEl.textContent='Connessione…';errorEl.textContent='';placeholder.style.display='none';destroyHls();video.pause();video.removeAttribute('src');video.load();const url=c.url;if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().then(()=>statusEl.textContent='In riproduzione').catch(()=>statusEl.textContent='Pronto');return}if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{statusEl.textContent='In riproduzione';video.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(ev,data)=>{if(data.fatal){statusEl.textContent='Errore stream';errorEl.textContent='Lo stream non è riproducibile o non è raggiungibile.';destroyHls()}})}else{statusEl.textContent='Browser non compatibile';errorEl.textContent='Il browser non supporta HLS.'}}
searchEl.addEventListener('input',render);document.getElementById('reload').onclick=loadPlaylist;document.getElementById('fullscreen').onclick=()=>{const el=document.querySelector('.player-wrap');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};video.addEventListener('playing',()=>{statusEl.textContent='In riproduzione';errorEl.textContent=''});video.addEventListener('waiting',()=>statusEl.textContent='Buffering…');video.addEventListener('error',()=>{if(video.error){statusEl.textContent='Errore';errorEl.textContent='Il video non può essere riprodotto da questo browser.'}});loadPlaylist();
</script>
</body></html>
